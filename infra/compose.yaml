name: clinic-foundation

services:
  postgres:
    # Verified PostgreSQL 18.6; update this digest deliberately.
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup first}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - clinic_postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  clinic_postgres:
