name: clinic-synthetic-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run db:up
      - run: npm run db:generate && npm run db:validate && npm run db:deploy && npm run db:seed && npm run db:check
      - run: npm run lint && npm run typecheck && npm run format:check && npm run openapi:check
      - run: npm run test && npm run test:ops:unit && npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm run smoke
      - run: npm audit --audit-level=high
      - run: node infra/prepare.mjs ci-stage7 staging
      - run: node infra/deploy.mjs ci-stage7 build staging && node infra/deploy.mjs ci-stage7 up staging
      - run: node infra/test-ops.mjs ci-stage7 && node infra/test-https.mjs ci-stage7
      - if: always()
        run: node infra/deploy.mjs ci-stage7 status staging
